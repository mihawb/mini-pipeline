[project]
name = "socnet-stub"
version = "0.1.0"
description = "Social Network mock-up module"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.163.1",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
